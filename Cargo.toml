[package]
name = "husker"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first terminal todo app"
repository = "https://github.com/romaklimenko/husker"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
ratatui = "0.30.2"
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.38", features = ["bundled"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"

[dev-dependencies]
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "io-util"] }

[profile.release]
lto = "thin"
strip = true
