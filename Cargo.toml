[package]
name = "husker"
version = "0.18.2"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first terminal todo app"
repository = "https://github.com/romaklimenko/husker"
publish = false

[dependencies]
anyhow = "1"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30.2"
ring = "0.17"
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.38", features = ["bundled"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net"] }
tower = { version = "0.5", features = ["util"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rqrr = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["process", "time", "io-util"] }

# tests/terminal_keys.rs opens a pseudo-terminal with rustix.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["fs", "pty", "stdio"] }

# The zip writer of the deployment package has tests. Run them with the rest.
[[example]]
name = "package"
test = true

[profile.release]
lto = "thin"
strip = true
